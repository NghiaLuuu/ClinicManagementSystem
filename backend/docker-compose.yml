version: '3.8'

services:
  clinic-postgres:
    image: postgres:15-alpine
    container_name: clinic_postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - clinic_pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  clinic_pgdata: